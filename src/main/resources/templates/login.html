<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/auth :: auth-head(#{login.title})}"></head>

<body class="auth-page">

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="row g-0 w-100">

            <div th:replace="~{fragments/auth :: auth-sidebar(#{auth.sidebar.login.title}, #{auth.sidebar.login.subtitle})}"></div>

            <div class="col-lg-7 col-12 form-side">
                <div class="auth-header">
                    <h2 class="auth-title" th:text="#{login.title}">Login</h2>
                    <p class="text-muted small" th:text="#{login.subtitle}">Enter your credentials to continue</p>
                </div>

                <div th:if="${success}" class="alert alert-success py-2 px-3 small mb-3 border-0 shadow-sm" style="background-color: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32 !important;">
                    <strong th:text="#{auth.verify.success}">Account verified!</strong>
                </div>

                <div th:if="${info}" class="alert alert-info py-2 px-3 small mb-3 border-0 shadow-sm" style="background-color: #e3f2fd; color: #0d47a1; border-left: 4px solid #1976d2 !important;">
                    <strong th:text="#{auth.verify.already_active}">Already verified!</strong>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 px-3 small mb-3 border-0 shadow-sm" style="background-color: #ffebee; color: #c62828; border-left: 4px solid #c62828 !important;">
                    <strong th:text="#{auth.verify.error}">Link expired or invalid!</strong>
                </div>

                <div th:if="${param.disabled}" class="alert alert-warning py-2 px-3 small mb-3 border-0 shadow-sm" style="background-color: #fffde7; color: #856404; border-left: 4px solid #fbc02d !important;">
                    <form th:action="@{/resend-verification}" th:method="POST" style="display: flex; align-items: center; flex-wrap: nowrap; gap: 8px;">
                        <span class="small fw-bold" style="white-space: nowrap;" th:text="#{login.resend.label}">Account not active?</span>
                        <input type="email" name="email" class="form-control form-control-sm"
                               style="flex-grow: 1; height: 32px; font-size: 0.8rem; border: 1px solid #fbc02d;"
                               th:placeholder="#{login.resend.placeholder}" required>
                        <button type="submit" class="btn btn-warning btn-sm fw-bold" style="font-size: 0.75rem; height: 32px; white-space: nowrap; background-color: #fbc02d; border: none; color: #454000;" th:text="#{login.resend.button}">
                            Resend Link
                        </button>
                    </form>
                </div>

                <form th:action="@{/login}" th:method="POST" th:object="${loginSeedDto}">
                    <div class="form-group">
                        <label class="form-label small fw-bold" th:text="#{login.label.email}">Email Address</label>
                        <div class="input-wrapper position-relative">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" th:field="*{email}" class="form-input w-100" th:placeholder="#{login.placeholder.email}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label small fw-bold" th:text="#{login.label.password}">Password</label>
                        <div class="input-wrapper position-relative">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password"
                                   th:field="*{password}"
                                   class="form-input w-100"
                                   placeholder="••••••••"
                                   minlength="8"
                                   maxlength="20"
                                   required
                                   th:oninvalid="this.setCustomValidity([[#{auth.password.minlength}]])"
                                   oninput="this.setCustomValidity('')">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 py-2 fw-bold shadow-sm mt-3" th:text="#{login.button}">Login</button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        <span th:text="#{login.reactivate.link.text}">Existing account deactivated?</span>
                        <a th:href="@{/users/reactivate}" class="text-dark fw-bold text-decoration-none" th:text="#{login.reactivate.link.action}">Reactivate here</a>
                    </p>
                </div>

                <div class="text-center mt-3">
                    <p class="small text-muted mb-0">
                        <span th:text="#{login.footer.noaccount}">Don't have an account?</span>
                        <a th:href="@{/register}" class="text-dark fw-bold text-decoration-none" th:text="#{login.footer.register}">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
